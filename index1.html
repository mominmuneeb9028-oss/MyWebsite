<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navbar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <img src="images/logo3.png" alt="Logo">
    </div>
  
    <div class="menu" id="menu">
        <a href="#">Home</a>
        <a href="#">Product</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search for products, brands and more">
      <i class="fa fa-search"></i>
    </div>

    <div class="nav-icons">
      <div class="icon">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
      </div>

      <div class="icon">
      <i class="fa-solid fa-cart-shopping"></i>
      <span>Add to Cart</span>
    </div>
      
    </div>

    <div class="hamburger" onclick="toggleMenu()">
    <i class="fa fa-bars"></i>
  </div>
  </nav>

 <div id="carouselExampleFade" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000" data-bs-pause="false" data-bs-touch="false">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="images/sale4.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="images/sale2.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="images/sale3.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="images/sale5.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="images/sale6.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="images/sale7.png" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

  <script>
    function toggleMenu() 
    {
    document.getElementById("menu").classList.toggle("active");
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
